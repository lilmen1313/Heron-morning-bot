name: bestchange-watch

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python watcher.py --once
        env:
          WATCHER_CONFIG: ${{ secrets.WATCHER_CONFIG }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
